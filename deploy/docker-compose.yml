# arise 풀스택 (arise-ai.pusan.ac.kr) — 실배포 구성(nginx / was / postgres)
# 네트워크 2분할: edge(공개), data(DB 비공개). 자원제한은 ceiling(상한).
# 참고: redis 캐시 + 모니터링(prometheus/grafana/node-exporter/cadvisor) 설계(도면 v1.2)는
#       현재 미배포라 제거함. 필요 시 git 이력(이 줄 도입 직전 커밋)에서 복원할 것.
name: arise

services:
  # ---------- 리버스 프록시 (TLS 종단 + 서브도메인 라우팅) ----------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./sites:/etc/nginx/sites:ro   # 부속 사이트(airc/aiedu/aigs 등) 정적 루트 — site-*.conf 가 사용
    depends_on:
      - was
    networks: [edge]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 128M }

  # ---------- WAS (Express + 정적 dist 서빙) ----------
  was:
    build:
      context: ..
      dockerfile: Dockerfile
    image: arise-was:latest
    restart: unless-stopped
    env_file: .env
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, data]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1024M }

  # ---------- PostgreSQL (사이트 DB) ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2048M }

networks:
  edge:
  data:

volumes:
  pgdata:
