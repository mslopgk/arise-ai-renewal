<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI대학원 · 준비 중</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: #0b0d12; color: #e8e8ea;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background-image: radial-gradient(60% 50% at 50% 0, rgba(54,114,184,.18), transparent);
    }
    .wrap { text-align: center; padding: 40px; }
    .kicker { font-size: 13px; letter-spacing: .25em; color: #7a8aa0; text-transform: uppercase; margin-bottom: 18px; }
    h1 { font-size: clamp(28px, 6vw, 52px); font-weight: 800; line-height: 1.15; letter-spacing: -.02em; }
    .sub { margin-top: 18px; color: #9aa3b2; font-size: 16px; }
    .badge { margin-top: 28px; display: inline-block; border: 1px solid #2a3344; border-radius: 999px; padding: 8px 18px; color: #86b6f0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">Pusan National University · AI</div>
    <h1>AI대학원</h1>
    <p class="sub">웹사이트를 준비하고 있습니다.</p>
    <div class="badge">Coming soon</div>
  </div>
</body>
</html>
