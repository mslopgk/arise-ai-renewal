# AI대학원 — aigs.pusan.ac.kr / axgs.pusan.ac.kr
# 사이트 개발 전: ~/arise-stack/sites/aigs 의 정적 플레이스홀더 서빙.
# 빌드 후 배포: 빌드물(dist/*)을 ~/arise-stack/sites/aigs/ 에 떨구면 즉시 서빙(정적/SPA).
#   백엔드가 필요한 사이트면 이 443 블록을 proxy_pass 로 교체.
# 인증서: 부산대 와일드카드 *.pusan.ac.kr (arise-ai 와 동일 인증서 재사용).

server {
    listen 80;
    listen [::]:80;
    server_name aigs.pusan.ac.kr axgs.pusan.ac.kr;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aigs.pusan.ac.kr axgs.pusan.ac.kr;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /etc/nginx/sites/aigs;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
